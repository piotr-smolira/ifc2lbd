[project]
authors = [{name = "piotr-smolira", email = "pimas@dtu.dk"}]
dependencies = ["toposort>=1.10,<2", "ifcopenshell>=0.8.4.post1,<0.9", "rdflib", "requests", "beautifulsoup4"]
name = "ifc2lbd"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "ifcopenshell"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
ifc2lbd = { path = ".", editable = true }

[tool.pixi.tasks]
convert = "python src/main.py"

[tool.pixi.feature.stable-pypi.dependencies]
python = ">=3.11,<3.14"
requests = "*"
beautifulsoup4 = "*"
toposort = ">=1.10,<2"
rdflib = "*"
ifcopenshell = ">=0.8.4.post1,<0.9"

[tool.pixi.feature.stable-conda.dependencies]
python = "*"
ifcopenshell = ">=0.8.4.post1,<0.9"
lark = ">=1.3.0,<2"

[tool.pixi.feature.experimental-conda.dependencies]
python = "*"
ifcopenshell = { version = ">=0.8.5alpha260112,<0.9", channel = "ifcopenshell" }
pyoxigraph = ">=0.5.3.post1,<0.6"
lark = ">=1.3.0,<2"

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.performance-test.dependencies]
psutil = "*"
pytest-benchmark = "*"

[tool.pixi.feature.benchmark.dependencies]
psutil = "*"

[tool.pixi.environments]
stable-conda = { features = ["stable-conda"], no-default-feature = true }
stable-pypi = { features = ["stable-pypi", "benchmark"], no-default-feature = true }
experimental-conda = { features = ["experimental-conda", "benchmark"], no-default-feature = true }
test = ["test"]
perf-test = ["test", "performance-test"]

[tool.pixi.dependencies]
pyoxigraph = ">=0.5.3.post1,<0.6"
psutil = "*"

[tool.pixi.feature.stable-conda.tasks]
attr = "python src/lbd/attribute_name.py"
cli = "python src/main.py"
test = "python src/main.py -i data/input/Duplex.ifc -o data/output/Duplex-spf.ttl --verbose"
rail_test = "python src/main.py -i data/input/Rail.ifc -o data/output/Rail.ttl --verbose"

[tool.pixi.feature.experimental-conda.tasks]
# Stream with 1 pass and optimized converter
stream_1pass = "python src/main.py -i data/input/InfraBridge.ifc -o data/output/InfraBridge-stream-1pass.ttl --converter mini_ifcowl --stream --verbose --single-pass"
# Stream with 1 pass, optimized converter and profiling
stream_1pass_profiling = "python src/main.py -i data/input/InfraBridge.ifc -o data/output/InfraBridge-stream-1pass-profiling.ttl --converter mini_ifcowl --stream --verbose --single-pass --profile"
# Stream with 1 pass, optimized converter and benchmarking
stream_1pass_benchmark = "python src/main.py -i data/input/InfraBridge.ifc -o data/output/InfraBridge-stream-1pass-benchmark.ttl --converter mini_ifcowl --stream --verbose --single-pass --benchmark"

[tool.pixi.feature.stable-pypi.tasks]

stream = "python src/main.py -i data/input/InfraBridge.ifc -o data/output/InfraBridge-mini_ifcowl.ttl --converter mini_ifcowl --stream --verbose"

stream_ifcowl = "python src/main.py -i data/input/Viadotto.ifc -o data/output/Viadotto-ifcowl.ttl --converter ifcowl --stream --verbose"

refactored = "python src/main.py -i data/input/InfraBridge.ifc -o data/output/InfraBridge-refactored-by-co.ttl --converter mini_ifcowl_complete --stream --verbose --benchmark"

functional = "python src/main.py -i data/input/InfraBridge.ifc -o data/output/InfraBridge-functional-by-co.ttl --converter mini_ifcowl_complete2 --stream --verbose --benchmark"


#### PLEASE use these tasks for testing.
refactored_test = "python src/main.py -i test_files/InfraBridge.ifc -o test_files/InfraBridge-refactored-test.ttl --converter mini_ifcowl_complete --stream --verbose"

functional_test = "python src/main.py -i test_files/InfraBridge.ifc -o test_files/InfraBridge-functional-test.ttl --converter mini_ifcowl_complete2 --stream --verbose"

geom = "python src/main.py -i data/input/Viadotto.ifc -o data/output/Viadotto-geom.ttl --converter mini_ifcowl_wkt --verbose --benchmark"

refac = "python src/main.py -i data/input/Duplex.ifc -o data/output/Duplex-refactored-test.ttl --converter mini_ifcowl_complete --stream --verbose --benchmark"

func = "python src/main.py -i data/input/Duplex.ifc -o data/output/Duplex-functional-test.ttl --converter mini_ifcowl_complete2 --stream --verbose --benchmark"

modelo_only_ifc = "python src/main.py -i data/input/modelo_MEP.ifc -o data/output/modelo_MEP.ttl --converter mini_ifcowl_complete --stream --verbose --benchmark"

modelo_geom = "python src/main.py -i data/input/IFC4_validated.ifc -o data/output/IFC4_validated-geom.ttl --converter mini_ifcowl_wkt --verbose --benchmark"

[dependency-groups]
stable-pypi = ["ifcopenshell>=0.8.4.post1,<0.9"] 
